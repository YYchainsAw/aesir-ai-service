# Replace example domain and certificate paths before installation.
# Do not set a document root or alias to the application, data or model folders.
server {
    listen 80;
    server_name api.example.invalid;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.example.invalid;
    ssl_certificate /etc/letsencrypt/live/api.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.invalid/privkey.pem;

    # Includes multipart metadata; the application separately limits audio to 2 MiB.
    client_max_body_size 3m;
    client_body_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_intercept_errors off;
    }
}
