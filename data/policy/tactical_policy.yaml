# 上下文策略的阈值与优先级（策划书 §5.1 第 4 层 / §6.2「纯 Python + YAML policy」）。
#
# 试玩调参只改本文件，不改代码；修改后重启服务生效（uvicorn --reload 只监视 .py）。
# 任何破坏性调整（阈值含义变化）应同步更新 revision，便于回执数据按策略版本归因。

revision: support-policy-001
event_revision: event-policy-001

# 能力目录（FR-035：能力注册表据此登记战斗行为）。ID 空间与策划书 §3.2 一致，
# resolver 的 ABIL_* 常量从这里派生——能力 ID 只有这一份来源，不在代码里另写。
abilities:
  basic_attack:
    id: ability.alice.basic_attack
    display_name: 奥术弹
    description: "低风险远程输出；常规攻击手段。"
  explosion:
    id: ability.alice.explosion
    display_name: 爆裂魔法
    description: "高伤害爆发；Boss 眩晕窗口优先使用。"
  quick_heal:
    id: ability.alice.quick_heal
    display_name: 快速治疗
    description: "小额快速治疗；玩家中低风险掉血时使用。"
  major_heal:
    id: ability.alice.major_heal
    display_name: 强效治疗
    description: "大额治疗、冷却较长；玩家濒危时优先。"
  shield:
    id: ability.alice.shield
    display_name: 魔法护盾
    description: "短期减伤；高危 Boss 行为或治疗不可用时使用。"

thresholds:
  player_hp_critical: 30   # 低于此阈值用强效治疗
  player_hp_low: 70        # 低于此阈值用快速治疗
  companion_mp_low: 20     # 艾莉蓝量低于此值走保守策略
  boss_melee_range_m: 5.0  # 玩家贴脸判定（reason code 用）

priorities:
  # /v1/tactical/resolve（玩家请求路径）
  major_heal: 95
  quick_heal: 85
  shield: 80
  burst: 85
  burst_pending_stun: 80   # 等眩晕登记：到战斗结束前保持
  retreat: 90
  follow: 40
  # /v1/combat/events（事件策略路径）
  event_major_heal: 90
  event_quick_heal: 90
  event_shield: 70
  event_burst: 85
