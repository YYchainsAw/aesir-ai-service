# 表达一致性校验策略（SDD T083 / FR-002 / FR-003）。
#
# 本文件维护对话输出的红线词表：出戏术语、禁忌表达、以及需要额外警惕的
# 虚构事实信号词。所有词表均为配置，代码不硬编码（章程原则 I）。
# 修改后重启服务生效；破坏性调整应同步 revision。

revision: style-policy-003

# 出戏术语（meta-language）：回复中不得出现任何破坏沉浸感的游戏机制/系统/协议词汇。
# 这些词属于「零容错」拦截：命中即判定违规。
meta_terms:
  - "指令"
  - "接口"
  - "频道"
  - "协议"
  - "系统"
  - "模型"
  - "参数"
  - "会话"
  - "请求"
  - "响应"
  - "后端"
  - "前端"
  - "客户端"
  - "服务端"
  - "数据库"
  - "缓存"
  - "NPC"
  - "AI"
  - "代码"
  - "脚本"
  - "配置"
  - "调试"
  - "日志"
  - "版本"
  - "更新"
  # T36 / FIX-08 补：实测对话发现的测试标注出戏（2026-09-28 端到端）
  - "第 1 次"
  - "第 2 次"
  - "第 3 次"
  - "第1次"
  - "第2次"
  - "第3次"

# 禁忌表达：角色不得使用占有、控制、贬低、胁迫或情感勒索式内容。
# 命中即判定违规（FR-003 / 章程技术约束）。
forbidden_expressions:
  - "你是我的"
  - "你只属于"
  - "没有我你什么都不是"
  - "你离不开我"
  - "你笨"
  - "你真蠢"
  - "废物"
  - "垃圾"
  - "去死"
  - "你怎么不去死"
  - "不听我的就"
  - "你敢不"
  - "我为你付出这么多"
  - "你辜负我"
  - "你欠我的"

# 虚构事实的高危信号词：当角色使用这些短语声称玩家过去说过/答应过/做过某事时，
# 特别容易越过「记忆诚实」边界。style_guard 会结合当前注入的记忆做轻量拦截。
# 注意：这不能替代 memory.facts 的接地校验，而是对话层的一道额外兜底。
fabrication_signals:
  - "你说过"
  - "你答应过"
  - "你承诺过"
  - "你告诉过我"
  - "当然记得"
  - "我怎么不记得"

# 已完成的路线自查声称；{actor} 由当前角色名/别名替换。
# 只有匹配该行动的 observation/shared_experience 记忆或成功查证可支持，
# 当前天气快照、任意其他记忆、模糊印象或旧模型回复均不能放行。
observation_claim_patterns:
  - '(?:路线|道路|这条路|前面的路|路)[^，。！？\n]{0,8}{actor}(?:已经|刚刚|大致|仔细|早就|曾经|之前|都|也|先){0,3}(?:看过|检查过|勘察过|查看过|探查过|走过)(?:了)?'
  - '{actor}(?:已经|刚刚|大致|仔细|早就|曾经|之前|都|也|先|把){0,4}(?:看过|检查过|勘察过|查看过|探查过|走过)(?:了)?[^，。！？\n]{0,8}(?:路线|道路|前面的路|这条路)'

self_status_claim_patterns:
  - '我(?:这边|现在|目前|的)?(?:魔力|法力|体力|血量|生命值)[^，。！？\n]{0,5}(?:充裕|充沛|充足|足够|满了|恢复好了)'

# 校验行为配置
checks:
  # 出戏术语与禁忌表达直接命中即违规
  direct_match: true
  # 虚构事实信号词需要上下文中有对应记忆才允许；无记忆时命中即违规
  require_memory_for_fabrication_signals: true
