# 世界观知识库（SDD US6 / FR-036~FR-038，T070 填充首版）。
#
# 供只读查证工具检索：NPC 回答设定类问题先查本文件，查不到就明确表示不确定，
# 绝不编造。每条目必须登记 source（FR-012 可追溯）——没有出处的内容不进库，
# 由 app/services/skills/tools.py 的加载校验强制。
#
# 收录纪律：**只收设计文档已经确立的事实**。设计文档没写的世界观（例如
# 「遗迹是谁建的」）刻意留空，它正是「查不到 → 明确不确定」这条验收路径的
# 用例，不能为了显得知识库充实而现编一段设定。

revision: lore-002

entries:
  - id: lore.companion.alice
    topic: 艾莉是谁
    keywords: [艾莉, alice, 队友, 法师, 同伴, 擅长]
    content: >-
      艾莉是队伍里唯一的法师队友，擅长远程魔法、治疗与支援；性格活泼、
      嘴上不饶人，但很在意同伴的状态。
    source: "game-design-doc §3.1 + primary_companion.yaml identity/persona"

  - id: lore.ability.catalog
    topic: 艾莉的能力
    keywords: [能力, 技能, 奥术弹, 爆裂, 治疗, 护盾, 魔法, 输出]
    content: >-
      艾莉可用：奥术弹（常规远程输出）、爆裂魔法（高伤害爆发，Boss 眩晕窗口
      优先）、快速治疗（小额快速）、强效治疗（大额、冷却较长）、魔法护盾
      （短期减伤）。具体某个能力当前是否可用，以最新战况快照为准。
    source: "game-design-doc §3.2"

  - id: lore.combat.roles
    topic: 战斗分工
    keywords: [分工, 职责, 战士, 近战, 远程, 谁负责]
    content: >-
      战斗里玩家是近战战士，负责贴身输出并累积 Boss 的眩晕；艾莉站在远程，
      负责持续输出、治疗与护盾，并在关键战况出现时给出提示。
    source: "game-design-doc §3.1"

  - id: lore.boss.stun_loop
    topic: Boss 眩晕
    keywords: [boss, 眩晕, 破绽, 集火, 眩晕值, 窗口]
    content: >-
      Boss 的眩晕值由玩家的攻击累积，接近积满时它会露出破绽；积满后进入
      短暂眩晕，这是集中输出的窗口。眩晕结束后它回到常规状态。
    source: "game-design-doc §3.3"
